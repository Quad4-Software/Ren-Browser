packages:
  - frontend

# Top-level only. Nested under pnpm: is ignored and pnpm then rewrites this file.
allowBuilds:
  esbuild: true

overrides:
  brace-expansion@^2: 2.1.8
  brace-expansion@^5: 5.0.13
  postcss@^8: 8.5.33
  nanoid@^3: 3.3.20
  minimatch: 11.0.9
  dompurify: 3.4.18
  typescript: 6.0.3
  "@types/node": 26.6.6
  marked: 18.2.1
  "@napi-rs/canvas": 1.1.1

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true
autoInstallPeers: true
pmOnFail: error
