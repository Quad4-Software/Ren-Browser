packages:
  - frontend

# Top-level only. Nested under pnpm: is ignored and pnpm then rewrites this file.
allowBuilds:
  esbuild: true

overrides:
  brace-expansion@^2: 2.1.4
  brace-expansion@^5: 5.0.9
  postcss@^8: 8.5.26
  nanoid@^3: 3.3.18
  minimatch@^9.0.0: 10.2.6
  dompurify: 3.4.13
  typescript: 6.0.3
  "@types/node": 22.20.1
  marked: 18.0.9
  "@napi-rs/canvas": 1.0.6

pnpm:
  minimumReleaseAge: 1440
  trustPolicy: no-downgrade
  trustPolicyIgnoreAfter: 525600
  blockExoticSubdeps: true
  strictDepBuilds: false
  engineStrict: true
  autoInstallPeers: true
  pmOnFail: error
