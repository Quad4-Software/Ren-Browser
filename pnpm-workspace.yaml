packages:
  - frontend

# Top-level only. Nested under pnpm: is ignored and pnpm then rewrites this file.
allowBuilds:
  esbuild: true

overrides:
  brace-expansion@^2: 2.1.2
  brace-expansion@^5: 5.0.8
  postcss@^8: 8.5.18
  minimatch@^9.0.0: 10.2.5
  dompurify: 3.4.12

pnpm:
  minimumReleaseAge: 1440
  trustPolicy: no-downgrade
  trustPolicyIgnoreAfter: 525600
  blockExoticSubdeps: true
  strictDepBuilds: false
  engineStrict: true
  autoInstallPeers: true
  pmOnFail: error
