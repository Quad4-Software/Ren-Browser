packages:
  - frontend

# Top-level only. Nested under pnpm: is ignored and pnpm then rewrites this file.
allowBuilds:
  esbuild: true

overrides:
  brace-expansion@^2: 2.1.7
  brace-expansion@^5: 5.0.12
  postcss@^8: 8.5.32
  nanoid@^3: 3.3.20
  minimatch@^9.0.0: 10.2.6
  dompurify: 3.4.17
  typescript: 6.0.3
  "@types/node": 26.6.5
  marked: 18.1.2
  "@napi-rs/canvas": 1.0.13

minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
blockExoticSubdeps: true
strictDepBuilds: false
engineStrict: true
autoInstallPeers: true
pmOnFail: error
