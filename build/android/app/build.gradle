plugins {
    id 'com.android.application'
}

def envOrEmpty(String key) {
    def value = System.getenv(key)
    return value == null ? "" : value.trim()
}

def readBrandVersion() {
    def brandFile = rootProject.file("../brand.yml")
    if (!brandFile.exists()) {
        throw new GradleException("Missing ${brandFile}")
    }
    def matcher = brandFile.getText("UTF-8") =~ /(?m)^version:\s*"([^"]+)"/
    if (!matcher.find()) {
        throw new GradleException("Could not read version from ${brandFile}")
    }
    return matcher.group(1).trim()
}

def androidVersionCode(String versionName) {
    String core = versionName.trim()
    if (core.startsWith("v") || core.startsWith("V")) {
        core = core.substring(1)
    }
    int plus = core.indexOf('+')
    if (plus >= 0) {
        core = core.substring(0, plus)
    }
    int dash = core.indexOf('-')
    if (dash >= 0) {
        core = core.substring(0, dash)
    }
    def parts = core.tokenize('.')
    if (parts.size() < 3) {
        throw new GradleException("Android versionName ${versionName} is not major.minor.patch")
    }
    int major = parts[0] as int
    int minor = parts[1] as int
    int patch = parts[2] as int
    if (major < 0 || minor < 0 || patch < 0 || minor > 99 || patch > 99) {
        throw new GradleException("Android versionCode overflow for ${versionName}")
    }
    return major * 10000 + minor * 100 + patch
}

def resolvedVersionName = envOrEmpty("ANDROID_VERSION_NAME")
if (resolvedVersionName.isEmpty()) {
    resolvedVersionName = readBrandVersion()
}
def resolvedVersionCodeEnv = envOrEmpty("ANDROID_VERSION_CODE")
def resolvedVersionCode = resolvedVersionCodeEnv.isEmpty()
        ? androidVersionCode(resolvedVersionName)
        : (resolvedVersionCodeEnv as int)
println "Android versionName=${resolvedVersionName} versionCode=${resolvedVersionCode}"

android {
    namespace 'com.wails.app'
    compileSdk 34

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "io.quad4.renbrowser"
        minSdk 21
        targetSdk 34
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        // Single universal APK for physical devices: arm64 + 32-bit ARM.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // One APK with both ABIs (no per-ABI split outputs).
    splits {
        abi {
            enable false
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: "renbrowser"
    def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystorePassword
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty() &&
            keystorePassword != null && !keystorePassword.trim().isEmpty() &&
            signingKeyAlias != null && !signingKeyAlias.trim().isEmpty() &&
            signingKeyPassword != null && !signingKeyPassword.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/armeabi-v7a/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
