# Ren Browser CI self-check config.
# Uses a loopback UDP interface so --self-check does not depend on the
# runner's physical NICs (IPv6 link-local + multicast), which are unavailable
# or restricted on some CI runners (e.g. windows-latest).

[reticulum]
  enable_transport = no
  share_instance = no

[interfaces]

  [[loopback]]
    type = UDPInterface
    enabled = yes
    address = 127.0.0.1:0
