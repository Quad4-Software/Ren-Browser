# Pinned third-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                    3d3c42e5aac5ba805825da76410c181273ba90b1
#   github/codeql-action/init@v4.37.7          ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
#   github/codeql-action/analyze@v4.37.7       ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd

name: CodeQL Advanced

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "19 20 * * 6"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup dependencies
        if: matrix.language == 'go'
        uses: ./.github/actions/setup
        with:
          install-wails: "false"
          install-linux-deps: "true"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: "/language:${{matrix.language}}"
