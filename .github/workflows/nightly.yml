name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

# Job-level permissions on reusable workflow callers are rejected at
# startup, so contents: write stays at the workflow level for the
# desktop-build publish job.
permissions:
  contents: write # zizmor: ignore[excessive-permissions] caller jobs cannot set permissions and the callee cannot elevate
  actions: read

jobs:
  ci:
    name: Require CI
    uses: $/.github/workflows/ci.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  build:
    needs: ci
    uses: $/.github/workflows/desktop-build.yml
    with:
      channel: nightly
      prerelease: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
