name: Interop

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: interop-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=vendor

jobs:
  interop:
    name: Live mesh interop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout Ren Browser
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: $/.github/actions/setup
        with:
          install-wails: "false"
          install-linux-deps: "true"

      - name: Interop tests
        run: task test:interop
        timeout-minutes: 15
