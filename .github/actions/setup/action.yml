# Pinned third-party actions (bump tag and SHA together when upgrading):
#   pnpm/action-setup@v6.0.10          0977fd99725f1db4007ccb2928dbb4e90d06cc86
#   actions/setup-go@v7.0.0            b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   actions/setup-node@v7.0.0          820762786026740c76f36085b0efc47a31fe5020
#   arduino/setup-task@v3.0.0          c0bc642852239c2689f73f4ea6459c29405f3c52

name: Setup Ren Browser
description: Install Go, Node, Task, and optional Linux desktop build dependencies

inputs:
  install-linux-deps:
    description: Install GTK/WebKit packages for Linux desktop builds
    required: false
    default: "false"
  install-wails:
    description: Install the wails3 CLI
    required: false
    default: "true"
  go-version:
    description: Go toolchain version
    required: false
    default: "1.26.6"
  pnpm-version:
    description: pnpm version
    required: false
    default: "11.22.0"
  task-version:
    description: Task version
    required: false
    default: "3.53.1"
  wails-version:
    description: wails3 module version tag
    required: false
    default: "v3.0.0-beta.9"
  cache-node:
    description: Enable pnpm cache in setup-node (only when the job runs pnpm install)
    required: false
    default: "false"
  skip_tree_verify:
    description: Set to true to skip renbrowser.rsm byte-level verify
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Verify before any step that may rewrite tracked files (pnpm project config).
    - name: Ensure rnid for tree verify
      if: inputs.skip_tree_verify != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v rnid >/dev/null 2>&1 || command -v reticulum-go >/dev/null 2>&1; then
          exit 0
        fi
        # PEP 668 / Homebrew Python: never pip-install into the system interpreter.
        # On Windows, upgrading via Scripts/pip.exe fails. Always use python -m pip.
        VENV="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/renbrowser-rns-venv"
        if command -v python3 >/dev/null 2>&1; then
          PY_CMD=python3
        elif command -v python >/dev/null 2>&1; then
          PY_CMD=python
        else
          echo "Ensure rnid: python3 or python not found" >&2
          exit 1
        fi
        "$PY_CMD" -m venv "$VENV"
        if [ -x "$VENV/bin/python" ]; then
          PY="$VENV/bin/python"
          BIN="$VENV/bin"
        elif [ -x "$VENV/Scripts/python.exe" ]; then
          PY="$VENV/Scripts/python.exe"
          BIN="$VENV/Scripts"
        else
          echo "Ensure rnid: venv created but python not found under $VENV" >&2
          exit 1
        fi
        "$PY" -m pip install 'rns>=1.3.8'
        echo "$BIN" >> "$GITHUB_PATH"

    - name: Verify tree RSM
      if: inputs.skip_tree_verify != 'true'
      shell: bash
      env:
        RNS_REQUIRED_SIGNER: e46112d44649266d71fe2193e00a4710
        RNS_INVENTORY_OUT: ${{ runner.temp }}/renbrowser-tree-inventory.txt
      run: sh build/scripts/verify-tree-rsm.sh

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: go.sum

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "22"
        cache: ${{ inputs.cache-node == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml

    - name: Setup Task
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52
      with:
        version: ${{ inputs.task-version }}

    - name: Install Linux desktop dependencies
      if: inputs.install-linux-deps == 'true'
      shell: bash
      run: bash "${GITHUB_WORKSPACE}/build/scripts/ci-install-linux-deps.sh"

    - name: Install wails3
      if: inputs.install-wails == 'true'
      shell: bash
      env:
        GOFLAGS: -mod=mod
        # CLI install must not pull Linux webview CGO (gtk4/webkitgtk).
        CGO_ENABLED: "0"
      run: |
        go install github.com/wailsapp/wails/v3/cmd/wails3@${{ inputs.wails-version }}
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Prepare Go build inputs
      shell: bash
      run: bash build/scripts/ci-prep-go.sh
