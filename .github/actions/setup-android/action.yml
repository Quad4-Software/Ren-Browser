# Pinned third-party actions (bump tag and SHA together when upgrading):
#   actions/setup-java@v5.7.0           b6effb05e454b25005698d916606bdc6ffcbf961

name: Setup Android SDK
description: Install JDK 21 and Android SDK/NDK for APK builds

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: "21"

    - name: Install Android SDK and NDK
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends unzip
        bash build/scripts/ci-setup-android.sh
