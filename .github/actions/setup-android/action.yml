# Pinned third-party actions (bump tag and SHA together when upgrading):
#   actions/setup-java@v6.3.0           d1374f8ac74474200d16ef8ecee22c7ae7a51880

name: Setup Android SDK
description: Install JDK 21 and Android SDK/NDK for APK builds

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
      with:
        distribution: temurin
        java-version: "21"

    - name: Install Android SDK and NDK
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends unzip
        bash build/scripts/ci-setup-android.sh
